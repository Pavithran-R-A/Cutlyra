name: Refresh Back Button Lockfile

on:
  push:
    branches: [fix/13-back-dismiss-sheet]
    paths:
      - ".github/workflows/refresh-back-button-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - name: Regenerate root workspace lockfile
        run: |
          bun install
          git diff --check
          node -e 'const x=require("./apps/mobile/package.json"); if(!x.dependencies["@capacitor/app"]) throw Error("missing @capacitor/app");'
          grep -q '"@capacitor/app"' bun.lock
      - name: Commit lockfile only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/13-back-dismiss-sheet"
          git config user.name "Pavithran R A"
          git config user.email "92867708+Pavithran-R-A@users.noreply.github.com"
          git add -- bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile unchanged and already consistent"
            exit 0
          fi
          git commit -m "chore: lock Capacitor App plugin for Android Back"
          git push origin HEAD:refs/heads/fix/13-back-dismiss-sheet
