name: Release (signed direct-distribution artifacts)

# Cutlyra direct-distribution release workflow. Google Play is a separate
# Android release channel handled by play-bundle.yml. On a `v*.*.*` tag push, this
# workflow:
#   1. Re-runs the exact same invariants gate bun-ci.yml runs on every
#      push to main (via `workflow_call` — see that file), so a release
#      can never ship on top of a red build. Nothing here duplicates that
#      job's steps.
#   2. Builds a SIGNED Android release APK. The signing keystore is
#      supplied entirely via repo secrets (ANDROID_RELEASE_KEYSTORE_BASE64 +
#      three password/alias secrets) — see docs/RELEASING.md for the
#      one-time setup a human does locally with `keytool` and
#      `gh secret set`. This workflow generates no secret material.
#   3. Attaches the Android APK, native symbols, and SHA256SUMS.txt to a
#      GitHub Release on the pushed tag. Android is the validated v0.1.0
#      shipping target. The iOS shell stays compile-checked in Mobile CI but
#      is deliberately NOT published as a release artifact until it receives
#      its own physical-device/release qualification.
#      Publishing is done with the `gh` CLI preinstalled on GitHub-hosted
#      runners — no third-party release action.
#
# This workflow has NOT had a real GitHub Actions run (no tag has been
# pushed). What HAS been verified directly, locally, in this session,
# against the real toolchains: `./gradlew assembleRelease` with the same
# four env vars this workflow sets, against a throwaway local test
# keystore, produces an APK that `apksigner verify` confirms is
# genuinely signed — and the same build without those env vars still
# succeeds (unsigned, different output filename — see
# docs/RELEASING.md); and the exact `apps/mobile/scripts/build-ios-
# unsigned-ipa.sh` this workflow calls, run standalone, produces a real
# arm64 Mach-O App.app and a validly-structured Payload/App.app .ipa.
# What's NOT verified: the workflow-as-a-whole in GitHub Actions itself
# (job graph, Android artifact hand-off, `gh release create`) — see
# docs/RELEASING.md §3 for the full breakdown.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  invariants:
    name: invariants gate
    uses: ./.github/workflows/bun-ci.yml

  release-preflight:
    name: Release provenance + version gate
    needs: invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require tag commit to be on main and match Android versionName
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit $GITHUB_SHA is not contained in origin/main." >&2
            exit 1
          fi

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' apps/mobile/android/app/build.gradle | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read Android versionName." >&2
            exit 1
          fi
          EXPECTED_TAG="v$VERSION_NAME"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName $VERSION_NAME (expected $EXPECTED_TAG)." >&2
            exit 1
          fi
          echo "Release provenance OK: $GITHUB_REF_NAME -> $GITHUB_SHA on main"

  android-release:
    name: Android (signed release APK)
    needs: release-preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build the mobile web harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync android
        run: bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 repo secret is not set — see docs/RELEASING.md for one-time keystore setup." >&2
            exit 1
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: gradlew assembleRelease (signed)
        env:
          CUTLYRA_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          CUTLYRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          CUTLYRA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          CUTLYRA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
        working-directory: apps/mobile/android

      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -print -quit 2>/dev/null || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under build-tools (ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME)" >&2
            exit 1
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK"
          ZIPALIGN="$SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -P 16 -c 4 "$APK"
          # Google Play requires native code to support 16 KB page-size devices.
          # Verify every packaged ELF LOAD segment is aligned to at least 0x4000.
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          rm -rf "$RUNNER_TEMP/cutlyra-elf-apk"
          mkdir -p "$RUNNER_TEMP/cutlyra-elf-apk"
          unzip -q "$APK" 'lib/*/*.so' -d "$RUNNER_TEMP/cutlyra-elf-apk"
          READELF="$READELF" ELF_ROOT="$RUNNER_TEMP/cutlyra-elf-apk" python3 - <<'PY'
          import os, pathlib, subprocess, sys
          readelf = os.environ["READELF"]
          root = pathlib.Path(os.environ["ELF_ROOT"])
          libs = list(root.rglob("*.so"))
          if not libs:
              raise SystemExit("no native libraries found in APK")
          for lib in libs:
              out = subprocess.check_output([readelf, "-lW", str(lib)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                        if line.lstrip().startswith("LOAD ")]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"16 KB ELF alignment failed for {lib}: {aligns}")
              print(f"16 KB ELF OK: {lib} {aligns}")
          PY
          unzip -l "$APK" | grep -q "assets/models/ggml-tiny.en.bin"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libcutlyra_whisper.so"
          MODEL_SHA="$(unzip -p "$APK" assets/models/ggml-tiny.en.bin | sha256sum | awk '{print $1}')"
          test "$MODEL_SHA" = "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f"
          SYMBOLS="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          test -s "$SYMBOLS"
          if unzip -l "$APK" | grep -Eq 'spike\.html|spike-assets|assets/spike'; then
            echo "::error::Internal spike assets leaked into release APK." >&2
            exit 1
          fi
        working-directory: apps/mobile/android

      - name: Stage release artifact
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release-artifacts/cutlyra-${{ github.ref_name }}-android.apk"
          cp apps/mobile/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            "$GITHUB_WORKSPACE/release-artifacts/cutlyra-${{ github.ref_name }}-android-native-debug-symbols.zip"

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-apk
          path: |
            release-artifacts/*.apk
            release-artifacts/*-native-debug-symbols.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [android-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: downloaded

      - name: Flatten artifact layout + checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find downloaded -type f \( -name '*.apk' -o -name '*-native-debug-symbols.zip' \) -exec cp {} release-artifacts/ \;
          (cd release-artifacts && sha256sum -- * > SHA256SUMS.txt)
          ls -la release-artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            release-artifacts/* \
            --title "Cutlyra ${{ github.ref_name }}" \
            --notes "Direct-distribution build. Google Play releases use the separate Play AAB workflow and Play App Signing.

          - **Android:** signed APK. Sideload install — see \`docs/guides/android-sideload.md\`.
          - **iOS:** unsigned \`.ipa\`. Install via AltStore/SideStore (free Apple ID, 7-day re-sign), or build from source via Xcode — see \`docs/guides/ios-xcode-build.md\`.

          \`SHA256SUMS.txt\` is included for artifact verification."
