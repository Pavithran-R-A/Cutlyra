name: Regenerate Cutlyra Brand Preview

on:
  push:
    branches: [brand/cutlyra-timeline-icon]
    paths:
      - "assets/brand/cutlyra-mark.svg"
      - "scripts/generate-brand-assets.py"
      - ".github/workflows/brand-assets-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install deterministic image dependencies
        run: python -m pip install "pillow==11.3.0" "cairosvg==2.8.2"
      - name: Regenerate all brand rasters
        run: python scripts/generate-brand-assets.py
      - name: Verify Google Play icon dimensions, PNG encoding and maximum size
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("assets/brand/play-store-icon-512.png")
          im = Image.open(p)
          assert im.size == (512, 512), im.size
          assert im.format == "PNG", im.format
          assert im.mode == "RGBA", im.mode
          assert p.stat().st_size <= 1_024 * 1024, p.stat().st_size
          assert im.getpixel((0, 0))[:3] == (11, 23, 44)
          print(f"Play icon ready: {im.size}, {im.mode}, {p.stat().st_size} bytes")
          PY
      - name: Record raster updates in the exact feature branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "brand/cutlyra-timeline-icon" ]; then
            echo "::error::wrong branch"
            exit 1
          fi
          git config user.name "Pavithran R A"
          git config user.email "92867708+Pavithran-R-A@users.noreply.github.com"
          git add -A -- assets/brand apps/mobile/android/app/src/main/res \
            apps/mobile/ios/App/App/Assets.xcassets apps/web/public/icons \
            apps/web/public/favicon.ico
          if git diff --cached --quiet; then
            echo "All icon assets already current."
            exit 0
          fi
          git commit -m "brand: refresh launcher, splash, iOS, web and Play icons"
          git push origin HEAD:refs/heads/brand/cutlyra-timeline-icon
