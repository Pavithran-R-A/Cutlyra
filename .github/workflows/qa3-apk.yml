name: QA3 signed APK

# The one workflow allowed to hold the QA3 signing key.
#
# Threat model this file is written against: anything that can choose the
# source tree while the key is in the environment can steal the key. So there
# is no `ref` input — the workflow builds the commit it was dispatched on,
# refuses anything that is not `refs/heads/main`, re-checks that exact SHA
# against the completed Bun CI and Mobile CI runs, and records the SHA that
# `git rev-parse HEAD` actually produced (never a separate, possibly unrelated
# workflow SHA).
#
# Required configuration (owner does this once, outside any agent session —
# see docs/qa/qa3-distribution.md):
#   secrets.CUTLYRA_QA3_KEYSTORE_BASE64      base64 of the QA3 .jks
#   secrets.CUTLYRA_QA3_KEYSTORE_PASSWORD
#   secrets.CUTLYRA_QA3_KEY_ALIAS
#   secrets.CUTLYRA_QA3_KEY_PASSWORD
#   vars.CUTLYRA_QA3_CERT_SHA256             pinned signer certificate digest
#
# Missing credentials FAIL this job; they never silently fall back to a debug
# signature, and no artifact is uploaded from a failed run.

on:
  workflow_dispatch:

concurrency:
  group: qa3-apk
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  qa3-signed-apk:
    name: QA3 (signed, verified, installable)
    runs-on: ubuntu-latest

    steps:
      - name: Refuse anything but a main dispatch
        run: |
          set -euo pipefail
          echo "ref=$GITHUB_REF"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow only signs main. Dispatched ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout the dispatched commit (not a branch name)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove the source commit is qualified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Provenance is the commit actually on disk, never a separate value
          # supplied by the dispatch.
          SHA=$(git rev-parse HEAD)
          echo "checked out $SHA (dispatch sha $GITHUB_SHA)"
          test "$SHA" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SHA" origin/main
          echo "QA3_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"

          for wf in "Bun CI" "Mobile CI"; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$wf\")] | sort_by(.created_at) | last | (if . == null then \"absent\" else .status + \"/\" + (.conclusion // \"pending\") end)")
            echo "$wf on $SHA: $state"
            if [ "$state" != "completed/success" ]; then
              echo "::error::$wf has not completed successfully on $SHA ($state); refusing to sign unqualified source." >&2
              exit 1
            fi
          done

      - name: QA3 signing gate
        env:
          QA3_KEYSTORE_BASE64: ${{ secrets.CUTLYRA_QA3_KEYSTORE_BASE64 }}
          QA3_KEYSTORE_PASSWORD: ${{ secrets.CUTLYRA_QA3_KEYSTORE_PASSWORD }}
          QA3_KEY_ALIAS: ${{ secrets.CUTLYRA_QA3_KEY_ALIAS }}
          QA3_KEY_PASSWORD: ${{ secrets.CUTLYRA_QA3_KEY_PASSWORD }}
          QA3_CERT_SHA256: ${{ vars.CUTLYRA_QA3_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${QA3_KEYSTORE_BASE64:-}" ] || missing="$missing CUTLYRA_QA3_KEYSTORE_BASE64"
          [ -n "${QA3_KEYSTORE_PASSWORD:-}" ] || missing="$missing CUTLYRA_QA3_KEYSTORE_PASSWORD"
          [ -n "${QA3_KEY_ALIAS:-}" ] || missing="$missing CUTLYRA_QA3_KEY_ALIAS"
          [ -n "${QA3_KEY_PASSWORD:-}" ] || missing="$missing CUTLYRA_QA3_KEY_PASSWORD"
          [ -n "${QA3_CERT_SHA256:-}" ] || missing="$missing vars.CUTLYRA_QA3_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::QA3 signing is not configured (missing:$missing). No installable QA3 artifact can be produced." >&2
            exit 1
          fi
          echo "$QA3_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qa3.jks"
          test -s "$RUNNER_TEMP/qa3.jks"
          echo "QA3 keystore staged in the runner temp dir (contents never printed)."
          echo "INTERNAL_QA3_CERT_SHA256=$QA3_CERT_SHA256" >> "$GITHUB_ENV"

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build mobile payload + sync Android
        run: |
          bun run build
          bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-qa3-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: gradlew assembleQa3 (QA3 key)
        env:
          CUTLYRA_QA3_KEYSTORE: ${{ runner.temp }}/qa3.jks
          CUTLYRA_QA3_KEYSTORE_PASSWORD: ${{ secrets.CUTLYRA_QA3_KEYSTORE_PASSWORD }}
          CUTLYRA_QA3_KEY_ALIAS: ${{ secrets.CUTLYRA_QA3_KEY_ALIAS }}
          CUTLYRA_QA3_KEY_PASSWORD: ${{ secrets.CUTLYRA_QA3_KEY_PASSWORD }}
        run: ./gradlew assembleQa3 --console=plain
        working-directory: apps/mobile/android

      - name: Verify QA3 identity, signature and payload
        run: bash ../../../scripts/ci/qa3-verify-apk.sh
        working-directory: apps/mobile/android

      - name: Upload QA3 APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutlyra-qa3-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/qa3/*.apk
            apps/mobile/android/app/build/outputs/apk/qa3/qa3-apk.sha256
            apps/mobile/android/app/build/outputs/apk/qa3/qa3-signer.txt
          if-no-files-found: error

      - name: Emulator smoke (API 35) — install, launch, coexist
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/mobile/android
          script: bash "$GITHUB_WORKSPACE/scripts/ci/qa3-emulator-smoke.sh"
