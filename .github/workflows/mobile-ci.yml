name: Mobile CI

# Cutlyra mobile health + Android release-smoke CI.
# Android builds/tests are release-relevant for v0.1.0. The iOS job is only
# a source/compile-health check: it builds for the Simulator with
# CODE_SIGNING_ALLOWED=NO and does NOT produce a distributed iOS binary.
#
# Signed direct-distribution Android artifacts live in
# .github/workflows/release.yml behind a `v*.*.*` tag push. Google Play AAB
# generation is handled separately by .github/workflows/play-bundle.yml —
# see docs/RELEASING.md and docs/PLAY_STORE_RELEASE.md.

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ios-simulator-build:
    name: iOS (simulator, unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync ios
        # Copies www/ into ios/App/App/public and updates the plugin list —
        # both gitignored, regenerated here on every run (see
        # apps/mobile/.gitignore's comment on why).
        run: bunx cap sync ios
        working-directory: apps/mobile

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: xcodebuild (Debug, iphonesimulator, CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: apps/mobile/ios/App

  android-debug-build:
    name: Android (debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync android
        run: bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: gradlew testDebugUnitTest
        # Cutlyra M4/M9: the Android-framework-free helpers
        # (media/MediaMath.kt; edl/EdlParser.kt + export/TransitionAlphaMath.kt
        # + export/EdlTicks.kt as of M9) run as plain JVM unit tests — no
        # emulator needed. The rest of M4/M9's native pipeline
        # (MediaProbe/ThumbnailStripGenerator/MediaImporter/MediaPickerIntents;
        # EdlToComposition/Media3Exporter's golden-frame harness) is
        # instrumentation-only (app/src/androidTest). The dedicated
        # android-instrumentation job below runs those tests on an API 35
        # emulator after this build job is green.
        run: ./gradlew testDebugUnitTest --console=plain
        working-directory: apps/mobile/android

      - name: gradlew assembleDebug
        run: ./gradlew assembleDebug --console=plain
        working-directory: apps/mobile/android

      - name: gradlew assembleQa
        # Isolated physical-device QA2 variant: separate application ID
        # (app.cutlyra.editor.qa2), distinct app label, debug signing, no
        # shared app-private storage. Built from the same source SHA as the
        # production debug build so QA exercises representative logic. The
        # `.qa2` identity lets this APK coexist with the older `.qa` install,
        # whose different debug certificate makes an in-place update impossible.
        run: ./gradlew assembleQa --console=plain
        working-directory: apps/mobile/android

      - name: Verify isolated QA2 package and debug signing
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/qa/app-qa.apk"
          test -s "$APK"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          AAPT="$BUILD_TOOLS/aapt2"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='app.cutlyra.editor.qa2'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'Cutlyra QA 2'"
          "$AAPT" dump badging "$APK" | grep -q "launchable-activity: name='app.cutlyra.editor.FirstRunActivity'  label='Cutlyra QA 2'"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'app.cutlyra.editor.qa2.fileprovider'
          # The QA2 identity must never regress to the older .qa package: an
          # accidental match would ship an APK that cannot overwrite it.
          if "$AAPT" dump badging "$APK" | grep -q "package: name='app.cutlyra.editor.qa'"; then
            echo "::error::QA APK must be app.cutlyra.editor.qa2, not the older app.cutlyra.editor.qa" >&2
            exit 1
          fi

          # APK integrity + the offline-caption payload the variant inherits
          # from the debug build must be present, or the variant is not the
          # representative QA surface we intend to qualify.
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -q "assets/models/ggml-tiny.en.bin"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libcutlyra_whisper.so"

          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"

          sha256sum "$APK" | tee app/build/outputs/apk/qa/app-qa.apk.sha256
          {
            echo "### Isolated QA2 APK"
            echo ""
            echo "- source commit: \`${GITHUB_SHA}\`"
            echo "- package: \`app.cutlyra.editor.qa2\`"
            echo "- label: \`Cutlyra QA 2\`"
            echo "- provider: \`app.cutlyra.editor.qa2.fileprovider\`"
            echo "- signing: Android Debug"
            echo "- sha256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: apps/mobile/android

      - name: Upload isolated QA2 APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutlyra-qa2-debug-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/qa/app-qa.apk
            apps/mobile/android/app/build/outputs/apk/qa/app-qa.apk.sha256
          if-no-files-found: error

      - name: Verify bundled offline-caption payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/public/legal/CUTLYRA-LICENSE.txt"
          unzip -l "$APK" | grep -q "assets/public/legal/CUTLYRA-NOTICE.txt"
          unzip -l "$APK" | grep -q "assets/public/legal/THIRD_PARTY_NOTICES.md"
          unzip -l "$APK" | grep -q "assets/public/legal/SOUNDTOUCHJS-LICENSE.txt"
          unzip -l "$APK" | grep -q "assets/public/legal/WHISPERCPP-LICENSE.txt"
          unzip -l "$APK" | grep -q "assets/models/ggml-tiny.en.bin"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libcutlyra_whisper.so"
        working-directory: apps/mobile/android

      - name: gradlew :app:assembleDebugAndroidTest
        # Cutlyra M9: compiles + packages the instrumentation tests
        # (including ExportGoldenFrameInstrumentedTest.kt) against the real
        # Android SDK/Media3 API surface on every push — catches compile-time
        # regressions before the dedicated emulator job executes the suite.
        #
        # Scoped to `:app:` deliberately, NOT the bare `assembleDebugAndroidTest`
        # (which also builds every OTHER subproject's androidTest variant):
        # `capacitor-cordova-android-plugins`'s androidTest variant hits a
        # pre-existing `checkDebugAndroidTestDuplicateClasses` kotlin-stdlib
        # version conflict (1.8.22 vs. a cordova-bundled 1.6.21) that has
        # nothing to do with this app module or M9 — confirmed by reproducing
        # it locally with the bare task and NOT with this scoped one. Fixing
        # that pre-existing cross-module conflict is out of scope here.
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain
        working-directory: apps/mobile/android

      - name: Build unsigned release APK + AAB smoke artifacts
        run: ./gradlew assembleRelease bundleRelease --console=plain
        working-directory: apps/mobile/android

      - name: Verify unsigned release packaging
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          SYMBOLS="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          MODEL_SHA="921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f"

          test -s "$APK"
          test -s "$AAB"
          test -s "$SYMBOLS"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -P 16 -c 4 "$APK"
          # Google Play requires native code to support 16 KB page-size devices.
          # Verify every packaged ELF LOAD segment is aligned to at least 0x4000.
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          rm -rf "$RUNNER_TEMP/cutlyra-elf-apk"
          mkdir -p "$RUNNER_TEMP/cutlyra-elf-apk"
          unzip -q "$APK" 'lib/*/*.so' -d "$RUNNER_TEMP/cutlyra-elf-apk"
          READELF="$READELF" ELF_ROOT="$RUNNER_TEMP/cutlyra-elf-apk" python3 - <<'PY'
          import os, pathlib, subprocess, sys
          readelf = os.environ["READELF"]
          root = pathlib.Path(os.environ["ELF_ROOT"])
          libs = list(root.rglob("*.so"))
          if not libs:
              raise SystemExit("no native libraries found in APK")
          for lib in libs:
              out = subprocess.check_output([readelf, "-lW", str(lib)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                        if line.lstrip().startswith("LOAD ")]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"16 KB ELF alignment failed for {lib}: {aligns}")
              print(f"16 KB ELF OK: {lib} {aligns}")
          PY
          unzip -l "$APK" | grep -q "assets/models/ggml-tiny.en.bin"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libcutlyra_whisper.so"
          test "$(unzip -p "$APK" assets/models/ggml-tiny.en.bin | sha256sum | awk '{print $1}')" = "$MODEL_SHA"

          unzip -t "$AAB" >/dev/null
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          rm -rf "$RUNNER_TEMP/cutlyra-elf-aab"
          mkdir -p "$RUNNER_TEMP/cutlyra-elf-aab"
          unzip -q "$AAB" 'base/lib/*/*.so' -d "$RUNNER_TEMP/cutlyra-elf-aab"
          READELF="$READELF" ELF_ROOT="$RUNNER_TEMP/cutlyra-elf-aab" python3 - <<'PY'
          import os, pathlib, subprocess
          readelf = os.environ["READELF"]
          root = pathlib.Path(os.environ["ELF_ROOT"])
          libs = list(root.rglob("*.so"))
          if not libs:
              raise SystemExit("no native libraries found in AAB")
          for lib in libs:
              out = subprocess.check_output([readelf, "-lW", str(lib)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                        if line.lstrip().startswith("LOAD ")]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"16 KB ELF alignment failed for {lib}: {aligns}")
              print(f"16 KB ELF OK: {lib} {aligns}")
          PY
          unzip -l "$AAB" | grep -q "base/assets/public/legal/CUTLYRA-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/CUTLYRA-NOTICE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/THIRD_PARTY_NOTICES.md"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/SOUNDTOUCHJS-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/WHISPERCPP-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/models/ggml-tiny.en.bin"
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "base/lib/x86_64/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/"
          test "$(unzip -p "$AAB" base/assets/models/ggml-tiny.en.bin | sha256sum | awk '{print $1}')" = "$MODEL_SHA"

          if unzip -l "$APK" | grep -Eq 'spike\.html|spike-assets|assets/spike|assets/autotest-|assets/legacy-harness-'; then
            echo "::error::Internal spike assets leaked into release APK." >&2
            exit 1
          fi
          if unzip -l "$AAB" | grep -Eq 'spike\.html|spike-assets|assets/spike|assets/autotest-|assets/legacy-harness-'; then
            echo "::error::Internal spike assets leaked into release AAB." >&2
            exit 1
          fi
        working-directory: apps/mobile/android

      - name: Stage checksum-verified unsigned release candidate for POCO
        # Stage 17 found an old packaged Vite bundle. Validate the fresh
        # checked-out editor entrypoint against the actual release APK.
        # Never auto-sign with a new key: an in-place update must use the
        # original disposable QA certificate to preserve on-device projects.
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          cmp ../www/index.html <(unzip -p "$APK" assets/public/index.html)
          mkdir -p "$GITHUB_WORKSPACE/device-qa"
          cp "$APK" "$GITHUB_WORKSPACE/device-qa/cutlyra-$GITHUB_SHA-unsigned-release.apk"
          cd "$GITHUB_WORKSPACE/device-qa"
          sha256sum -- *.apk > SHA256SUMS.txt
          echo "source_commit=$GITHUB_SHA" > BUILD_PROVENANCE.txt
          echo "workflow_run=$GITHUB_RUN_ID" >> BUILD_PROVENANCE.txt
          echo "variant=release" >> BUILD_PROVENANCE.txt
          echo "signing=UNSIGNED (QA certificate required before device install)" >> BUILD_PROVENANCE.txt
        working-directory: apps/mobile/android

      - name: Upload unsigned release APK for POCO qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutlyra-unsigned-device-qa
          path: device-qa/
          retention-days: 14
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutlyra-debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-instrumentation:
    name: Android instrumentation (API 35 emulator)
    needs: android-debug-build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner." >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build mobile payload + sync Android
        run: |
          bun run build
          bunx cap sync android
        working-directory: apps/mobile

      - name: Device-isolation guard self-test (dry-run only)
        run: bash apps/mobile/android/scripts/test-device-isolation.sh

      - name: Run connected Android instrumentation suite
        # Pinned to the immutable commit behind upstream v2.38.0 (the release
        # commit includes the action's runtime node_modules; a later source
        # commit without them failed before emulator startup with
        # MODULE_NOT_FOUND @actions/core). This action handles AVD
        # creation/boot readiness; our earlier hand-rolled
        # background emulator could exit before adb appeared and leave
        # `adb wait-for-device` hanging until the job timeout.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/mobile/android
          # #54: pull the filmstrip contact sheet the thumbnail test writes to
          # the app's internal files dir (``adb shell`` cannot read
          # /sdcard/Android/data since Android 11, so this goes through run-as on
          # the debuggable build). A missing sheet must not mask a test failure,
          # and a failed test must not cost us the artifact: hence set +e and
          # capturing gradle's status rather than relying on errexit.
          # Keep every command on one physical line — this action runs the
          # script line by line through sh -c, where a trailing backslash does
          # not continue the way it does inside a script file.
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true; echo $? > /tmp/cutlyra-connected-test-status
            mkdir -p app/build/outputs/androidTest-evidence
            adb exec-out run-as app.cutlyra.editor cat files/filmstrip-evidence/thumbnail-strip-contact-sheet.png > app/build/outputs/androidTest-evidence/thumbnail-strip-contact-sheet.png
            [ "$(wc -c < app/build/outputs/androidTest-evidence/thumbnail-strip-contact-sheet.png)" -ge 1024 ] || { rm -f app/build/outputs/androidTest-evidence/thumbnail-strip-contact-sheet.png; echo "::error::the filmstrip contact sheet was not pulled off the device"; exit 1; }
            test_status=$(cat /tmp/cutlyra-connected-test-status); if [ "$test_status" -eq 0 ]; then ./gradlew :app:assembleQa --console=plain && adb install -r app/build/outputs/apk/qa/app-qa.apk && adb shell pm list packages | grep -qx 'package:app.cutlyra.editor.qa2' && adb shell pm list packages | grep -qx 'package:app.cutlyra.editor' && ! adb shell pm list packages | grep -qx 'package:app.cutlyra.editor.qa' && adb logcat -c && adb shell am start -W -n app.cutlyra.editor.qa2/app.cutlyra.editor.FirstRunActivity && sleep 8 && adb shell pidof app.cutlyra.editor.qa2 >/dev/null && ! adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION.*app.cutlyra.editor.qa2' && adb shell dumpsys activity activities | grep -q 'mResumedActivity.*app.cutlyra.editor.qa2' && adb shell run-as app.cutlyra.editor.qa2 ls >/dev/null 2>&1 && adb shell run-as app.cutlyra.editor ls >/dev/null 2>&1 && qa2_uid=$(adb shell dumpsys package app.cutlyra.editor.qa2 | grep -m1 'userId=' | tr -dc '0-9') && prod_uid=$(adb shell dumpsys package app.cutlyra.editor | grep -m1 'userId=' | tr -dc '0-9') && [ -n "$qa2_uid" ] && [ -n "$prod_uid" ] && [ "$qa2_uid" != "$prod_uid" ] && echo 'QA2 variant coexistence smoke passed' || { echo '::error::QA2 variant coexistence smoke failed'; test_status=1; }; fi; exit "$test_status"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-instrumentation-results
          path: |
            apps/mobile/android/app/build/reports/androidTests/connected/
            apps/mobile/android/app/build/outputs/androidTest-results/connected/
            apps/mobile/android/app/build/outputs/androidTest-evidence/
          if-no-files-found: warn
          retention-days: 14

  # Mission C (GitHub #57): proves the R8 keep rules in
  # app/proguard-rules.pro against the FULL instrumented suite on the
  # CI-only `r8test` build type (release-like: minified, resources
  # shrunk, debug-key signed). The distribution `release` build type
  # keeps minifyEnabled false — this job is the gate that must pass
  # before R8 may be considered for a real release: native plugin
  # registration, media import, captions (WhisperJNI native symbols),
  # MP4 export, backup and resource access must all survive R8.
  android-instrumentation-r8:
    name: Android instrumentation (R8 test variant)
    needs: android-debug-build
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner." >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build mobile payload + sync Android
        run: |
          bun run build
          bunx cap sync android
        working-directory: apps/mobile

      - name: Run connected Android instrumentation suite on the R8 test variant
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/mobile/android
          script: |
            ./gradlew :app:connectedR8testAndroidTest -PcutlyraR8Test --console=plain -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true

      - name: Upload R8 mapping + instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-instrumentation-r8-results
          path: |
            apps/mobile/android/app/build/outputs/mapping/
            apps/mobile/android/app/build/reports/androidTests/connected/
            apps/mobile/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30

