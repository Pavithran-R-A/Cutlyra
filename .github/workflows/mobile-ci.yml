name: Mobile CI

# Cutlyra M3 — plan M3 exit criterion: "CI produces a signed APK and an
# installable iOS build (ad-hoc or unsigned .ipa) from a clean checkout."
# This workflow covers the unsigned/debug half of that (iOS simulator build
# with CODE_SIGNING_ALLOWED=NO, Android debug APK via gradle) — the same two
# builds verified locally in the M3 session, run on EVERY push/PR to `main`
# so debug builds never silently rot.
#
# Signed direct-distribution artifacts live in .github/workflows/release.yml,
# gated behind a `v*.*.*` tag push. Google Play AAB generation is handled
# separately by .github/workflows/play-bundle.yml — see docs/RELEASING.md
# and docs/PLAY_STORE_RELEASE.md. This workflow's iOS build
# intentionally still targets the Simulator, not a device: local signing
# is flaky from agent sessions, and there is deliberately no CI-held Apple
# signing identity anywhere in this project (release.yml's iOS artifact is
# unsigned by design — see that workflow's header comment for why).

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ios-simulator-build:
    name: iOS (simulator, unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync ios
        # Copies www/ into ios/App/App/public and updates the plugin list —
        # both gitignored, regenerated here on every run (see
        # apps/mobile/.gitignore's comment on why).
        run: bunx cap sync ios
        working-directory: apps/mobile

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: xcodebuild (Debug, iphonesimulator, CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: apps/mobile/ios/App

  android-debug-build:
    name: Android (debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync android
        run: bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: gradlew testDebugUnitTest
        # Cutlyra M4/M9: the Android-framework-free helpers
        # (media/MediaMath.kt; edl/EdlParser.kt + export/TransitionAlphaMath.kt
        # + export/EdlTicks.kt as of M9) run as plain JVM unit tests — no
        # emulator needed. The rest of M4/M9's native pipeline
        # (MediaProbe/ThumbnailStripGenerator/MediaImporter/MediaPickerIntents;
        # EdlToComposition/Media3Exporter's golden-frame harness) is
        # instrumentation-only (app/src/androidTest). The dedicated
        # android-instrumentation job below runs those tests on an API 35
        # emulator after this build job is green.
        run: ./gradlew testDebugUnitTest --console=plain
        working-directory: apps/mobile/android

      - name: gradlew assembleDebug
        run: ./gradlew assembleDebug --console=plain
        working-directory: apps/mobile/android

      - name: Verify bundled offline-caption payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/public/legal/CUTLYRA-LICENSE.txt"
          unzip -l "$APK" | grep -q "assets/public/legal/CUTLYRA-NOTICE.txt"
          unzip -l "$APK" | grep -q "assets/public/legal/THIRD_PARTY_NOTICES.md"
          unzip -l "$APK" | grep -q "assets/public/legal/SOUNDTOUCHJS-LICENSE.txt"
          unzip -l "$APK" | grep -q "assets/public/legal/WHISPERCPP-LICENSE.txt"
          unzip -l "$APK" | grep -q "assets/models/ggml-tiny.en.bin"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libcutlyra_whisper.so"
        working-directory: apps/mobile/android

      - name: gradlew :app:assembleDebugAndroidTest
        # Cutlyra M9: compiles + packages the instrumentation tests
        # (including ExportGoldenFrameInstrumentedTest.kt) against the real
        # Android SDK/Media3 API surface on every push — catches compile-time
        # regressions before the dedicated emulator job executes the suite.
        #
        # Scoped to `:app:` deliberately, NOT the bare `assembleDebugAndroidTest`
        # (which also builds every OTHER subproject's androidTest variant):
        # `capacitor-cordova-android-plugins`'s androidTest variant hits a
        # pre-existing `checkDebugAndroidTestDuplicateClasses` kotlin-stdlib
        # version conflict (1.8.22 vs. a cordova-bundled 1.6.21) that has
        # nothing to do with this app module or M9 — confirmed by reproducing
        # it locally with the bare task and NOT with this scoped one. Fixing
        # that pre-existing cross-module conflict is out of scope here.
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain
        working-directory: apps/mobile/android

      - name: Build unsigned release APK + AAB smoke artifacts
        run: ./gradlew assembleRelease bundleRelease --console=plain
        working-directory: apps/mobile/android

      - name: Verify unsigned release packaging
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          SYMBOLS="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          MODEL_SHA="921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f"

          test -s "$APK"
          test -s "$AAB"
          test -s "$SYMBOLS"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -P 16 -c 4 "$APK"
          # Google Play requires native code to support 16 KB page-size devices.
          # Verify every packaged ELF LOAD segment is aligned to at least 0x4000.
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          rm -rf "$RUNNER_TEMP/cutlyra-elf-apk"
          mkdir -p "$RUNNER_TEMP/cutlyra-elf-apk"
          unzip -q "$APK" 'lib/*/*.so' -d "$RUNNER_TEMP/cutlyra-elf-apk"
          READELF="$READELF" ELF_ROOT="$RUNNER_TEMP/cutlyra-elf-apk" python3 - <<'PY'
          import os, pathlib, subprocess, sys
          readelf = os.environ["READELF"]
          root = pathlib.Path(os.environ["ELF_ROOT"])
          libs = list(root.rglob("*.so"))
          if not libs:
              raise SystemExit("no native libraries found in APK")
          for lib in libs:
              out = subprocess.check_output([readelf, "-lW", str(lib)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                        if line.lstrip().startswith("LOAD ")]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"16 KB ELF alignment failed for {lib}: {aligns}")
              print(f"16 KB ELF OK: {lib} {aligns}")
          PY
          unzip -l "$APK" | grep -q "assets/models/ggml-tiny.en.bin"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libcutlyra_whisper.so"
          test "$(unzip -p "$APK" assets/models/ggml-tiny.en.bin | sha256sum | awk '{print $1}')" = "$MODEL_SHA"

          unzip -t "$AAB" >/dev/null
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          rm -rf "$RUNNER_TEMP/cutlyra-elf-aab"
          mkdir -p "$RUNNER_TEMP/cutlyra-elf-aab"
          unzip -q "$AAB" 'base/lib/*/*.so' -d "$RUNNER_TEMP/cutlyra-elf-aab"
          READELF="$READELF" ELF_ROOT="$RUNNER_TEMP/cutlyra-elf-aab" python3 - <<'PY'
          import os, pathlib, subprocess
          readelf = os.environ["READELF"]
          root = pathlib.Path(os.environ["ELF_ROOT"])
          libs = list(root.rglob("*.so"))
          if not libs:
              raise SystemExit("no native libraries found in AAB")
          for lib in libs:
              out = subprocess.check_output([readelf, "-lW", str(lib)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                        if line.lstrip().startswith("LOAD ")]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"16 KB ELF alignment failed for {lib}: {aligns}")
              print(f"16 KB ELF OK: {lib} {aligns}")
          PY
          unzip -l "$AAB" | grep -q "base/assets/public/legal/CUTLYRA-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/CUTLYRA-NOTICE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/THIRD_PARTY_NOTICES.md"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/SOUNDTOUCHJS-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/WHISPERCPP-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/models/ggml-tiny.en.bin"
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "base/lib/x86_64/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/"
          test "$(unzip -p "$AAB" base/assets/models/ggml-tiny.en.bin | sha256sum | awk '{print $1}')" = "$MODEL_SHA"

          if unzip -l "$APK" | grep -Eq 'spike\.html|spike-assets|assets/spike'; then
            echo "::error::Internal spike assets leaked into release APK." >&2
            exit 1
          fi
          if unzip -l "$AAB" | grep -Eq 'spike\.html|spike-assets|assets/spike'; then
            echo "::error::Internal spike assets leaked into release AAB." >&2
            exit 1
          fi
        working-directory: apps/mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutlyra-debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-instrumentation:
    name: Android instrumentation (API 35 emulator)
    needs: android-debug-build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner." >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build mobile payload + sync Android
        run: |
          bun run build
          bunx cap sync android
        working-directory: apps/mobile

      - name: Run connected Android instrumentation suite
        # Pinned to a reviewed commit rather than a floating v2 tag. This
        # action handles AVD creation/boot readiness; our earlier hand-rolled
        # background emulator could exit before adb appeared and leave
        # `adb wait-for-device` hanging until the job timeout.
        uses: ReactiveCircus/android-emulator-runner@ed009f5318f15b1cf93a191b856c4f1748a2d4c1
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: apps/mobile/android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-instrumentation-results
          path: |
            apps/mobile/android/app/build/reports/androidTests/connected/
            apps/mobile/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

