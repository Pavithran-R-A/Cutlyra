name: Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invariants:
    name: invariants gate
    uses: ./.github/workflows/bun-ci.yml

  android-play-bundle:
    name: Android Play bundle
    needs: invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require canonical main checkout
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LOCAL_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$LOCAL_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Play AABs must be built from current origin/main (local=$LOCAL_SHA main=$MAIN_SHA)." >&2
            exit 1
          fi
          echo "Play source OK: $LOCAL_SHA"

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"
      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build mobile web payload
        run: bun run build
        working-directory: apps/mobile
      - name: Sync Capacitor Android project
        run: bunx cap sync android
        working-directory: apps/mobile
      - name: Decode Play upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_UPLOAD_KEYSTORE_BASE64:-}" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 is not set; see docs/PLAY_STORE_RELEASE.md." >&2
            exit 1
          fi
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.keystore"
      - name: Build signed AAB
        env:
          CUTLYRA_RELEASE_KEYSTORE: ${{ runner.temp }}/play-upload.keystore
          CUTLYRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          CUTLYRA_RELEASE_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          CUTLYRA_RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain
        working-directory: apps/mobile/android
      - name: Verify AAB container and signature
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB" >/dev/null
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          rm -rf "$RUNNER_TEMP/cutlyra-elf-aab"
          mkdir -p "$RUNNER_TEMP/cutlyra-elf-aab"
          unzip -q "$AAB" 'base/lib/*/*.so' -d "$RUNNER_TEMP/cutlyra-elf-aab"
          READELF="$READELF" ELF_ROOT="$RUNNER_TEMP/cutlyra-elf-aab" python3 - <<'PY'
          import os, pathlib, subprocess
          readelf = os.environ["READELF"]
          root = pathlib.Path(os.environ["ELF_ROOT"])
          libs = list(root.rglob("*.so"))
          if not libs:
              raise SystemExit("no native libraries found in AAB")
          for lib in libs:
              out = subprocess.check_output([readelf, "-lW", str(lib)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines()
                        if line.lstrip().startswith("LOAD ")]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"16 KB ELF alignment failed for {lib}: {aligns}")
              print(f"16 KB ELF OK: {lib} {aligns}")
          PY
          unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/CUTLYRA-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/CUTLYRA-NOTICE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/THIRD_PARTY_NOTICES.md"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/SOUNDTOUCHJS-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/public/legal/WHISPERCPP-LICENSE.txt"
          unzip -l "$AAB" | grep -q "base/assets/models/ggml-tiny.en.bin"
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "base/lib/x86_64/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/"
          MODEL_SHA="$(unzip -p "$AAB" base/assets/models/ggml-tiny.en.bin | sha256sum | awk '{print $1}')"
          test "$MODEL_SHA" = "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f"
          if unzip -l "$AAB" | grep -Eq 'spike\.html|spike-assets|assets/spike'; then
            echo "::error::Internal spike assets leaked into Play bundle." >&2
            exit 1
          fi
          sha256sum "$AAB"
        working-directory: apps/mobile/android
      - name: Stage Play artifact
        run: |
          mkdir -p play-artifacts
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab play-artifacts/cutlyra-play-${{ github.sha }}.aab
          (cd play-artifacts && sha256sum *.aab > SHA256SUMS.txt)
      - name: Upload Play artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutlyra-play-aab
          path: play-artifacts/*
          if-no-files-found: error
          retention-days: 14
