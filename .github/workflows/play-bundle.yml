name: Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invariants:
    name: invariants gate
    uses: ./.github/workflows/bun-ci.yml

  android-play-bundle:
    name: Android Play bundle
    needs: invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"
      - name: Fetch and verify Android caption build inputs
        run: |
          bash scripts/fetch-whisper-cpp.sh
          bash scripts/download-whisper-model.sh tiny.en --platform android
        working-directory: apps/mobile

      - name: Build mobile web payload
        run: bun run build
        working-directory: apps/mobile
      - name: Sync Capacitor Android project
        run: bunx cap sync android
        working-directory: apps/mobile
      - name: Decode Play upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/PLAY_STORE_RELEASE.md." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.keystore"
      - name: Build signed AAB
        env:
          CUTLYRA_RELEASE_KEYSTORE: ${{ runner.temp }}/play-upload.keystore
          CUTLYRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CUTLYRA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CUTLYRA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain
        working-directory: apps/mobile/android
      - name: Verify AAB container and signature
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml"
          unzip -l "$AAB" | grep -q "base/assets/models/ggml-tiny.en.bin"
          unzip -l "$AAB" | grep -q "base/lib/arm64-v8a/libcutlyra_whisper.so"
          unzip -l "$AAB" | grep -q "base/lib/x86_64/libcutlyra_whisper.so"
          if unzip -l "$AAB" | grep -Eq 'spike\.html|spike-assets|assets/spike'; then
            echo "::error::Internal spike assets leaked into Play bundle." >&2
            exit 1
          fi
          sha256sum "$AAB"
        working-directory: apps/mobile/android
      - name: Stage Play artifact
        run: |
          mkdir -p play-artifacts
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab play-artifacts/cutlyra-play-${{ github.sha }}.aab
          (cd play-artifacts && sha256sum *.aab > SHA256SUMS.txt)
      - name: Upload Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutlyra-play-aab
          path: play-artifacts/*
          if-no-files-found: error
          retention-days: 14
