name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
  # Cutlyra M12 — lets .github/workflows/release.yml call this exact
  # matrix as its pre-release gate (`uses: ./.github/workflows/bun-ci.yml`)
  # instead of duplicating the invariants job. Adding this trigger changes
  # nothing about how push/pull_request runs behave.
  workflow_call: {}

jobs:
  invariants:
    name: invariants (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        # jetli/wasm-pack-action extracts to /tmp and then renames the
        # binary into ~/.cargo/bin; the current ubuntu-latest image puts
        # /tmp on a separate filesystem, so that rename dies with
        # "EXDEV: cross-device link not permitted" and every invariants
        # job on every branch goes red. Extract straight into the cargo
        # bin directory instead (tar writes in place, no cross-device
        # rename) and pin the version for reproducibility.
        shell: bash
        run: |
          set -euo pipefail
          version=0.15.0
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${version}/wasm-pack-v${version}-${target}.tar.gz" | tar -xz -C "$HOME/.cargo/bin" --strip-components=1
          wasm-pack --version

      - name: Cache Rust build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build WASM (rust/ workspace health check)
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          # bun.lock lives at the repo root (this is a Bun workspaces
          # monorepo, not a per-app lockfile) — apps/web/bun.lock does not
          # exist, so hashing it (the pre-fork key) always missed the cache.
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        # Workspace-aware install: must run from the repo root (where the
        # "workspaces" field lives), not apps/web — bun resolves the whole
        # monorepo graph into root node_modules regardless of cwd, but
        # scripts/invariants.sh explicitly checks for node_modules at the
        # repo root and fails fast with a clear message if it's missing.
        run: bun install

      - name: Audit shipped WASM dependency licenses
        # Traverse only the dependency closure reachable from opencut-wasm.
        # Missing, opaque, or copyleft/custom external licenses fail closed
        # for explicit review rather than being silently shipped.
        run: bun scripts/audit-wasm-licenses.mjs

      - name: "invariants.sh: build, typecheck, lint, unit tests, offline audit, bridge-import gate, mouse-event gate"
        shell: bash
        run: bash scripts/invariants.sh
