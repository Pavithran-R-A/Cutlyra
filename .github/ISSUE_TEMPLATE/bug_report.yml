name: Bug report
description: Report a reproducible problem in Cutlyra
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: app-version
    attributes:
      label: Cutlyra version
      description: Version/build you are running.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: Include the device model and Android version.
      placeholder: "Example: Pixel 9, Android 16"
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and any on-screen error.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create/open a project
        2. Import ...
        3. Tap ...
        4. Observe ...
    validations:
      required: true
  - type: dropdown
    id: recurrence
    attributes:
      label: How often?
      options:
        - Always
        - Usually
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: media-details
    attributes:
      label: Relevant media details
      description: Optional. Codec, resolution, duration, or source of the file if the problem involves import/playback/export.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Add screenshots or sanitized logs if useful. Do not upload private media unless you are comfortable sharing it.
    validations:
      required: false
